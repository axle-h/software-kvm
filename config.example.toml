# software-kvm config: copy to ~/.config/software-kvm/config.toml
# Run `./kvm.py probe` to see your devices' channels and your monitor's inputs.

# Easy-Switch button (1-3) the other computer is paired on
other_channel = 1

# A device dropping off only counts as an Easy-Switch press if a keyboard or mouse
# was used within this many seconds; otherwise it is assumed to have gone to sleep
active_window = 120

[monitor]
# Inputs for this computer and the other one: DP-1, DP-2, HDMI-1, HDMI-2, DVI-1, DVI-2,
# VGA-1, VGA-2, or a raw VCP 0x60 value such as 0x1b for vendor-specific inputs like USB-C
this_input = "DP-1"
other_input = "HDMI-1"

# Only needed with more than one external monitor: pick one by EDID serial or connector
# serial = "ABC1234"
# connector = "DP-2"
